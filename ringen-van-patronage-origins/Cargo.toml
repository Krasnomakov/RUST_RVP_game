[package]
name = "ringen_van_patronage_origins"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
