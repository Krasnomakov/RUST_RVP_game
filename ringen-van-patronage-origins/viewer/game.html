<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ringen game preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #game-root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050817; }
      #game-root { position: relative; }
      #game-canvas { display: block; width: 100%; height: 100%; outline: none; }
      #game-message { position: absolute; inset: 0; display: grid; place-items: center; padding: 28px; color: #a9bacb; background: #050817; font: 13px/1.6 system-ui, sans-serif; text-align: center; }
      #game-message.error { color: #ffc3ad; }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas" tabindex="0" aria-label="Ringen game canvas"></canvas>
      <div id="game-message" role="status">Loading the Rust game…</div>
    </div>
    <script type="module" src="loader.js"></script>
  </body>
</html>
