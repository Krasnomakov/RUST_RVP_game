name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Test everything
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ringen-van-patronage-origins

      - name: Run test suite
        run: ./scripts/test.sh

  build-and-deploy:
    name: Build game and publish
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ringen-van-patronage-origins

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Build the browser game
        working-directory: ringen-van-patronage-origins
        run: |
          cargo build --release --target wasm32-unknown-unknown --bin ringen_van_patronage_origins
          mkdir -p site
          wasm-bindgen --target web --out-name ringen_game --out-dir site \
            target/wasm32-unknown-unknown/release/ringen_van_patronage_origins.wasm

      - name: Assemble the static site
        working-directory: ringen-van-patronage-origins
        run: |
          sed 's#/game-build/#./#; s#/game/loader.js#./loader.js#' viewer/game.html > site/index.html
          sed 's#/game-build/#./#' viewer/game-loader.js > site/loader.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ringen-van-patronage-origins/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
